<div class="layout-container flex h-full grow flex-col">
  <app-header></app-header>
  <main class="px-10 flex flex-1 justify-center py-8 bg-gray-50">
    <div class="layout-content-container flex flex-col max-w-7xl flex-1">
      <!-- Page title -->
      <div class="flex items-center justify-between gap-3 p-4 mb-4">
        <div class="flex flex-col gap-1">
          <h1 class="text-gray-900 tracking-tight text-3xl font-bold">Dashboard</h1>
          <p class="text-gray-500 text-sm font-normal">An overview of current incident statuses and trends.</p>
        </div>
        <button class="flex items-center gap-2 rounded-md h-10 px-4 bg-[var(--primary-color)] text-white text-sm font-medium hover:bg-opacity-90 transition-colors">
          <span class="material-symbols-outlined"> add </span>
          <span>New Incident</span>
        </button>
      </div>
      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-4">
        <app-stat-card *ngFor="let card of statCards"
          [label]="card.label"
          [value]="card.value"
          [color]="card.color">
        </app-stat-card>
      </div>
      <!-- Recent incidents -->
      <h2 class="text-gray-900 text-xl font-bold tracking-tight px-4 pb-3 pt-8">Recent Incidents</h2>
      <app-recent-incidents [incidents]="incidents"></app-recent-incidents>
    </div>
  </main>
</div>
