<div class="dashboard-root">
  <app-header (search)="onSearch($event)"></app-header>

  <main class="dashboard-main">
    <div class="header-row">
      <div class="title">
        <h1>Dashboard</h1>
        <p>An overview of current incident statuses and trends.</p>
      </div>
      <button class="primary-btn" (click)="onNewIncident()">
        <span class="material-symbols-outlined">add</span>
        <span>New Incident</span>
      </button>
    </div>

    <div class="stats">
      <div class="card">
        <div class="card-header">
          <div class="dot red"></div>
          <p>Open Incidents</p>
        </div>
        <p class="value">12</p>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="dot yellow"></div>
          <p>In Progress</p>
        </div>
        <p class="value">8</p>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="dot green"></div>
          <p>Resolved</p>
        </div>
        <p class="value">45</p>
      </div>
    </div>

    <h2 class="section-title">Recent Incidents</h2>

    <app-recent-incidents [incidents]="recentIncidents"></app-recent-incidents>
  </main>
</div>
