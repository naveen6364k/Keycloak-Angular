<header class="dashboard-header">
  <div class="logo-nav">
    <div class="logo">
      <span class="material-symbols-outlined">verified_user</span>
      <h2>iAssure</h2>
    </div>
    <nav>
      <a class="active" href="#">Dashboard</a>
      <a href="#">Incidents</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
  </div>

  <div class="actions" *ngIf="profile">
    <label class="search-box">
      <span class="material-symbols-outlined">search</span>
      <input placeholder="Search" (input)="onSearch($event)" />
    </label>
    <a class="icon-btn" [routerLink]="['/notifications']">
      <span class="material-symbols-outlined">notifications</span>
      <div *ngIf="unreadNotifications > 0" class="notification-badge">{{ unreadNotifications }}</div>
    </a>
    <div class="profile-menu">
      <button class="avatar-btn" (click)="toggleDropdown()">
        <div
          class="avatar"
          [style.backgroundImage]="'url(' + (profile.picture || '') + ')'"
          *ngIf="profile.picture"
        ></div>
        <div
          class="avatar avatar-initials"
          *ngIf="!profile?.picture"
        >
          {{ userInitial }}
        </div>
      </button>
      <div class="dropdown-menu" *ngIf="isDropdownOpen">
        <a (click)="onViewProfile()">Profile</a>
        <a (click)="onLogout()">Logout</a>
      </div>
    </div>
  </div>
</header>
